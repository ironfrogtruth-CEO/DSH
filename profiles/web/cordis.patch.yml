- insert:
    - id: terminal
      name: "@deepseek-ai/dsh-terminal"
    - id: terminal-bash
      name: "@deepseek-ai/dsh-terminal-bash"
    - id: schedule
      name: "@deepseek-ai/dsh-schedule"
    - id: mcp-playwright
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        transport: stdio
        serverName: playwright
        command: npx
        args:
          - "@playwright/mcp@latest"
        env: {}
        cwd: /Users/marcus/Desktop
        toolCallTimeoutMs: 120000
        failOnStartupError: false
    - id: mcp-sequential-thinking
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        transport: stdio
        serverName: sequential-thinking
        command: npx
        args:
          - "@modelcontextprotocol/server-sequential-thinking@latest"
        env: {}
        cwd: /Users/marcus/Desktop
        toolCallTimeoutMs: 30000
        failOnStartupError: false
    - id: mcp-wechat
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        transport: stdio
        serverName: wechat-mp
        command: npx
        args:
          - -y
          - "@xihe-lab/wechat-mp-mcp-server@latest"
        env:
          WECHAT_APP_ID: wx5d8afee05a2c7a25
          WECHAT_APP_SECRET: 待填入-AppSecret
        cwd: /Users/marcus/Desktop
        toolCallTimeoutMs: 60000
        failOnStartupError: false
    - id: mcp-tencent-docs
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        transport: streamable-http
        serverName: tencent-docs
        url: https://docs.qq.com/openapi/mcp
        headers:
          Authorization: Bearer 待填入-腾讯文档个人访问令牌
        toolCallTimeoutMs: 60000
        failOnStartupError: false
    - id: mcp-zhipu
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        transport: stdio
        serverName: zhipu
        command: node
        args:
          - /Users/marcus/.dsh/mcp-servers/zhipu-mcp/server.mjs
        env: {}
        cwd: /Users/marcus/Desktop
        toolCallTimeoutMs: 700000
        failOnStartupError: false
- id: dsh-tool-policy
  name: "@local/dsh-tool-policy"
  config:
    mode: observe
    operationMode: act
    blockDetachedBackground: true
    workspaceRoots:
      - /Users/marcus/Desktop
      - /Users/marcus/.dsh
- id: dingtalk-channel
  name: "@dingtalk-real-ai/dsh-dingtalk"
  config:
    workspace: /Users/marcus/Desktop
    senderAccess: owner
    groupAccess: none
    imageMode: auto
    tools:
      enabled: true
    debug: false
    consoleCardTemplateId: f42ee85c-bdb9-4197-b8b7-4379e9b64878.schema
    defaultDingTalkPresetId: reliable-development
    accounts:
      - groupAccess: none
        id: default
        enabled: true
        clientIdRef: DINGTALK_CLIENT_ID
        clientSecretRef: DINGTALK_CLIENT_SECRET
        senderAccess: owner
        allowedSenders: []
        groupAllowlist: []
        sessionScope: chat
- id: dsh-dingtalk-status
  name: "@local/dsh-dingtalk-status"
- id: dsh-mobile-push
  name: "@local/dsh-mobile-push"
- insert:
    - id: dsh-paste-input
      name: "@dsh-external/dsh-paste-input"

# 虾缸 profile 用户补丁层: 继承自 Codex/Claude 配置的"好用插件"接线
# 1) 持久终端服务(PTY) — 供 tool-bash-persistent 使用
# 2) MCP 客户端 × 3 — figma / notion / playwright(来自 ~/.codex/config.toml)
#    均为 failOnStartupError: false: 无令牌/连接失败时优雅降级,不影响启动
- insert:
    - id: terminal
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'

    - id: mcp-figma
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: figma
        url: https://mcp.figma.com/mcp
        headers: {}
        toolCallTimeoutMs: 60000
        failOnStartupError: false

    - id: mcp-notion
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: notion
        url: https://mcp.notion.com/mcp
        headers: {}
        toolCallTimeoutMs: 60000
        failOnStartupError: false

    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: playwright
        command: npx
        args:
          - '@playwright/mcp@latest'
        env: {}
        cwd: /Users/marcus/Desktop
        toolCallTimeoutMs: 120000
        failOnStartupError: false

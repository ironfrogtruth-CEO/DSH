# Headless-only replacement layer. rc.8's patch dialect does not permit a
# name change on an id-targeted override, so the shipped row is disabled and
# one local replacement row is inserted. The Loader rejects duplicate IDs, so
# the replacement uses a distinct id while owning the same ctx.compaction
# service. Only the local row is active; the original provider is never
# mounted as an enabled service.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: true
- insert:
    - id: compaction-basic-v2
      name: '@local/dsh-compaction-v2'
      config:
        thresholdRatio: 0.65
        retainRatio: 0.24
        maxTokens: 8192
        compactionRetries: 1
        maxOverflowRetries: 1
        auto: true

# The dsh-base bundle also carries the optional web/search tools. Keep this
# profile strictly Host/headless: no web transport or browser-facing rows.
- id: web
  name: '@deepseek-ai/dsh-web'
  disabled: true
- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: true
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: true

# First acceptance pass observes policy decisions without blocking tools.
- id: dsh-tool-policy
  name: '@local/dsh-tool-policy'
  config:
    mode: observe
    operationMode: act
    workspaceRoots:
      - /Users/marcus/.dsh

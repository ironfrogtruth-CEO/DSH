# Lean reliable-development preset for local models.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    complete: true
    includeRuntimeContext: false
    text: |-
      You are a reliable local software-engineering agent. The available tool schemas are authoritative: never speculate about whether a listed tool exists.

      For a memory request, call memory_recall immediately with the user's keywords. For a coding task, inspect with persistent_bash, edit only the named file with str_replace_editor, then run the narrowest relevant test with persistent_bash. Load reliable-development when procedural detail is needed.

      For any complex task (multiple steps or artifacts, source-truth risk, rendering/export, external side effects, long execution, confirmation, or rollback), load goal-first-control before planning. Let it produce the goal contract and classify the task; only when it is `sop_required`, load sop-orchestrator and follow its node contracts. Simple one-step tasks may stay direct and must not be forced through the full SOP. For Chinese replies or artifacts, load native-chinese-expression after facts and domain boundaries are fixed and before final wording.

      ## Explicit Output Contract Gate
      Apply this gate to every task, including simple_direct tasks and SOP tasks. Extract only constraints stated explicitly by the user into an `output_contract` before drafting: requested quantity, format, length limit, language, result-only/answer-only instruction, and forbidden content. Keep unspecified fields unspecified; never invent a constraint. The user's explicit output constraints govern the final response unless they conflict with a higher-priority instruction.

      Before sending the final response, check every populated `output_contract` field against the actual response: count exactly what was requested, use the requested format and language, stay within the requested length, return only the result when requested, and omit every forbidden item. If any check fails, self-correct exactly once and run the full check again. If the user says “只给一句” or “只用一句话”, the final response must be exactly one sentence: no heading, preface, explanation, alternatives, options, bullets, or trailing note. Do not expose the contract or process unless the user asks for it. If a higher-priority safety or system requirement prevents literal compliance, satisfy that requirement and state the minimum necessary limitation.

      Work on one file or contract at a time. Preserve unrelated changes. Never delete, reset, commit, push, or claim a test passed without direct evidence. After a material milestone call memory_checkpoint with objective, files, tests, remaining work, and next action. Never store credentials.

- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        description: Run concise bash commands. Inspect before editing and avoid large output.

- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 12000

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.60
        retainTokens: 32768
        maxTokens: 2048
        compactionRetries: 2
        maxOverflowRetries: 2
        auto: true

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 3072
        headChars: 1536
        tailChars: 512

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magazine Editor</title>
<style>
:root{
  --primary:#f05a22;--ink:#1f2933;--muted:#63717d;--paper:#fffdf8;--bg:#e8e2d8;--line:#e4ded4;
  --page-w:794px;--page-h:1123px;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink)}
.editor-toolbar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.95);border:1px solid #d9dee6;border-radius:999px;padding:6px 8px;box-shadow:0 8px 22px rgba(0,0,0,.09)}
.editor-toolbar button{border:1px solid #cdd4df;background:#fff;border-radius:999px;padding:5px 10px;font-size:12px;color:#263442;cursor:pointer}.editor-toolbar button.primary{background:var(--primary);border-color:var(--primary);color:#fff}.editor-toolbar .edit-only{display:none}.edit-mode .editor-toolbar .edit-only{display:inline-block}
.deck{display:flex;flex-direction:column;align-items:center;gap:28px;padding:56px 0 60px}.page{position:relative;width:var(--page-w);height:var(--page-h);background:var(--paper);overflow:hidden;box-shadow:0 12px 35px rgba(23,35,45,.16);page-break-after:always}.canvas-a4{--page-w:794px;--page-h:1123px}.canvas-16x9{--page-w:1280px;--page-h:720px}
.layer-bg,.layer-top,.layer-footer{position:absolute;left:0;right:0;pointer-events:auto}.layer-bg{top:0;width:100%;height:100%;background:var(--paper);z-index:0}.layer-top{top:0;width:100%;height:var(--top-h);z-index:5}.layer-footer{bottom:0;width:100%;height:var(--footer-h);z-index:5}.layer-top img,.layer-footer img,.image-widget img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}.layer-top img,.layer-footer img{-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,var(--op-start,1)),rgba(0,0,0,var(--op-end,1)));mask-image:linear-gradient(to bottom,rgba(0,0,0,var(--op-start,1)),rgba(0,0,0,var(--op-end,1)))}
.widget{position:absolute;z-index:30}.widget-body{width:100%;height:100%;overflow:visible}.widget-body[contenteditable="true"]{outline:none}.widget-body *{max-width:100%}.shape-card{background:rgba(255,255,255,.88);border:1px solid rgba(33,72,60,.14);border-radius:18px;box-shadow:0 10px 24px rgba(35,52,44,.08);padding:18px}.image-slot{width:100%;height:100%;border:1px dashed rgba(99,113,125,.55);border-radius:14px;display:grid;place-items:center;overflow:hidden;background:rgba(255,255,255,.6)}.img-hint{font-size:13px;color:#87919a}.title h1{font-size:42px;line-height:1.12;margin:0;color:var(--ink)}.title p{font-size:17px;line-height:1.65;color:var(--muted)}.metric strong{display:block;font-size:58px;line-height:1;color:var(--primary);font-family:Georgia,serif}.metric span{font-size:15px;color:var(--muted);font-weight:800}.note{font-size:13px;color:#7b6a55;background:#fff5e9;border-left:4px solid var(--primary);padding:10px 12px;border-radius:0 10px 10px 0}.mini-table{border-collapse:collapse;width:100%;font-size:12px}.mini-table th{background:#edf3ea;color:#24483c;text-align:left}.mini-table th,.mini-table td{border:1px solid #e2e7df;padding:8px;line-height:1.45}.bar{height:12px;background:#eee6dc;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#f2a15f)}
.edit-mode .selectable:hover,.edit-mode .widget:hover{outline:1px dashed rgba(240,90,34,.48)}.selected{outline:2px solid var(--primary)!important;box-shadow:0 0 0 4px rgba(240,90,34,.12)}
.widget-control{display:none}.edit-mode .selected>.widget-control{display:block}.drag-handle{position:absolute;top:-24px;left:0;background:var(--primary);color:#fff;border-radius:999px;padding:3px 9px;font-size:12px;cursor:move;user-select:none}.delete-btn{position:absolute;top:-24px;right:0;border:0;background:#263442;color:#fff;border-radius:999px;width:22px;height:22px;cursor:pointer}.resize-handle{position:absolute;width:9px;height:9px;background:#fff;border:1px solid var(--primary);border-radius:50%}.resize-handle.nw{left:-5px;top:-5px;cursor:nwse-resize}.resize-handle.n{left:50%;top:-5px;cursor:ns-resize}.resize-handle.ne{right:-5px;top:-5px;cursor:nesw-resize}.resize-handle.e{right:-5px;top:50%;cursor:ew-resize}.resize-handle.se{right:-5px;bottom:-5px;cursor:nwse-resize}.resize-handle.s{left:50%;bottom:-5px;cursor:ns-resize}.resize-handle.sw{left:-5px;bottom:-5px;cursor:nesw-resize}.resize-handle.w{left:-5px;top:50%;cursor:ew-resize}
.prop-panel{display:none;position:fixed;right:18px;top:64px;width:238px;background:rgba(255,255,255,.96);border:1px solid #d9dee6;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:9998;padding:12px}.edit-mode .prop-panel.active{display:block}.prop-panel h3{margin:0 0 10px;font-size:14px;color:#24313f}.prop-panel label{display:block;font-size:11px;color:#65727f;margin:8px 0 4px}.prop-panel input,.prop-panel select{width:100%;font-size:12px;padding:4px}.prop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.prop-grid button,.prop-panel button{border:1px solid #cfd7e2;background:#fff;border-radius:8px;font-size:12px;padding:5px;cursor:pointer}.image-props{display:none}.prop-panel.for-image .image-props{display:block}
@media print{body{background:#fff}.editor-toolbar,.prop-panel,.widget-control{display:none!important}.deck{display:block;padding:0}.page{box-shadow:none;margin:0;break-after:page;page-break-after:always}.selected{outline:none!important;box-shadow:none!important}@page{size:auto;margin:0}}
</style>
</head>
<body>
<div class="editor-toolbar">
  <button id="editToggle" class="primary">开启编辑</button>
  <button class="edit-only" id="insertTextBtn">插入文字</button>
  <button class="edit-only" id="insertImageBtn">插入图片</button>
  <button class="edit-only" id="replaceTopBtn">替换顶部图</button>
  <button class="edit-only" id="replaceFooterBtn">替换页脚图</button>
  <button class="edit-only" id="setBgBtn">背景图</button>
  <button id="saveBtn">保存HTML</button>
  <button id="printBtn">导出PDF</button>
</div>
<div id="propPanel" class="prop-panel">
  <h3 id="propTitle">属性</h3>
  <label>字体</label><select id="fontFamily"><option value='-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif'>默认中文</option><option value='Georgia,serif'>Georgia</option><option value='Arial,sans-serif'>Arial</option></select>
  <label>字号</label><input id="fontSize" type="number" min="8" max="96" value="16">
  <label>颜色</label><input id="fontColor" type="color" value="#1f2933">
  <div class="prop-grid" style="margin-top:8px"><button id="boldBtn">B</button><button id="alignLeft">左</button><button id="alignCenter">中</button><button id="alignRight">右</button></div>
  <label>整体透明度</label><input id="layerOpacity" type="range" min="0" max="100" value="100">
  <div class="image-props">
    <label>图片上透明度</label><input id="imgTopOpacity" type="range" min="0" max="100" value="100">
    <label>图片下透明度</label><input id="imgBottomOpacity" type="range" min="0" max="100" value="100">
  </div>
  <label>图层顺序</label><div class="prop-grid"><button id="zUp">上移</button><button id="zDown">下移</button><button id="zTop">置顶</button><button id="zBottom">置底</button></div>
  <button id="deleteSelected" style="width:100%;margin-top:10px">删除选中</button>
</div>
<input id="imagePicker" type="file" accept="image/*" hidden>
<main id="deck" class="deck"></main>
<script id="magazine-spec" type="application/json">{"title": "A4固定画布示例_杂志编辑器Skill", "canvas_type": "a4", "theme": {"primary": "#f05a22", "ink": "#1f2933", "paper": "#fffdf8"}, "pages": [{"id": "a4-cover", "kind": "cover", "top": {"height": 380, "opStart": 1, "opEnd": 0.22}, "footer": {"height": 193, "opStart": 0.08, "opEnd": 1}, "background": {"color": "#fffdf8"}, "components": [{"type": "text", "name": "封面标题", "x": 70, "y": 148, "w": 640, "h": 140, "z": 30, "className": "title", "html": "<h1>A4固定画布报告</h1><p>轻量编辑器：默认看报告，编辑时才出现工具。</p>"}, {"type": "text", "name": "卷首语", "x": 72, "y": 420, "w": 620, "h": 240, "z": 30, "className": "shape-card", "html": "<h2 style='margin:0 0 14px;color:#f05a22'>卷首语</h2><p style='font-size:18px;line-height:1.9'>这一页只保留报告入口和简短说明，不堆数据边界、不堆模块。顶部图和页脚图都是独立图层，可替换，并支持上下渐变透明度。</p>"}]}, {"id": "a4-content", "kind": "content", "top": {"height": 220, "opStart": 0.92, "opEnd": 0.18}, "footer": {"height": 123, "opStart": 0.08, "opEnd": 0.95}, "background": {"color": "#fffdf8"}, "components": [{"type": "text", "name": "页面标题", "x": 58, "y": 58, "w": 650, "h": 90, "z": 30, "html": "<h2 style='font-size:30px;line-height:1.18;margin:0'>每页是固定A4画布，不随浏览器漂移</h2><p style='font-size:14px;color:#63717d'>正文、图片、图形模块均为绝对定位组件。</p>"}, {"type": "text", "name": "大数字卡1", "x": 58, "y": 190, "w": 200, "h": 210, "z": 30, "className": "shape-card metric", "html": "<span>核心数据</span><strong>51%</strong><p>大数字适合承载一个需要被记住的结果。</p><div class='bar'><i style='width:51%'></i></div>"}, {"type": "text", "name": "解读模块", "x": 288, "y": 190, "w": 448, "h": 210, "z": 30, "className": "shape-card", "html": "<h3 style='margin:0 0 12px;color:#21483c'>每个数据必须有解读</h3><p style='font-size:16px;line-height:1.75'>图形不是摆设。每个数据结果都要说明：它意味着什么、与上下文有什么关系、下一步应对动作是什么。</p><p class='note'>属性面板仅在选中组件后出现。</p>"}, {"type": "image", "name": "图片示例", "x": 58, "y": 440, "w": 310, "h": 210, "z": 30}, {"type": "text", "name": "小表格同步说明", "x": 398, "y": 440, "w": 338, "h": 210, "z": 30, "className": "shape-card", "html": "<h3 style='margin:0 0 10px;color:#21483c'>小表格同步说明</h3><table class='mini-table'><tr><th>字段</th><th>说明</th></tr><tr><td>画布</td><td>A4固定尺寸</td></tr><tr><td>编辑</td><td>选中后属性面板</td></tr><tr><td>导出</td><td>打印时隐藏控件</td></tr></table>"}]}]}</script>
<script>
(() => {
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const spec=JSON.parse($('#magazine-spec').textContent.trim());
const sizes={a4:{w:794,h:1123,top:220,footer:123,coverTop:380,coverFooter:193},'16x9':{w:1280,h:720,top:96,footer:72,coverTop:210,coverFooter:96}};
const size=sizes[spec.canvas_type]||sizes.a4; let edit=false,selected=null,drag=null,resize=null,savedRange=null;
document.title=spec.title||'Magazine Editor'; document.documentElement.style.setProperty('--primary',spec.theme?.primary||'#f05a22'); document.documentElement.style.setProperty('--ink',spec.theme?.ink||'#1f2933'); document.documentElement.style.setProperty('--paper',spec.theme?.paper||'#fffdf8'); document.documentElement.style.setProperty('--page-w',size.w+'px'); document.documentElement.style.setProperty('--page-h',size.h+'px');
const deck=$('#deck'); deck.classList.add(spec.canvas_type==='16x9'?'canvas-16x9':'canvas-a4');
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){deck.innerHTML=''; (spec.pages||[]).forEach((p,i)=>{const isCover=p.kind==='cover'; const page=document.createElement('section'); page.className='page '+(isCover?'cover':''); page.dataset.pageId=p.id||('p'+(i+1)); page.style.setProperty('--top-h',(p.top?.height || (isCover?size.coverTop:size.top))+'px'); page.style.setProperty('--footer-h',(p.footer?.height || (isCover?size.coverFooter:size.footer))+'px');
const bg=document.createElement('div'); bg.className='layer-bg selectable'; bg.dataset.layerName='背景图'; bg.dataset.layerType='background'; bg.style.background=p.background?.color||spec.theme?.paper||'#fffdf8'; if(p.background?.src)bg.style.backgroundImage=`url(${p.background.src})`,bg.style.backgroundSize='cover'; page.appendChild(bg);
page.appendChild(imageLayer('top',p.top,'顶部图')); page.appendChild(imageLayer('footer',p.footer,'页脚图'));
(p.components||[]).forEach(c=>page.appendChild(component(c))); deck.appendChild(page)}); initAll();}
function imageLayer(type,c={},name){const d=document.createElement('div'); d.className='layer-'+type+' selectable'; d.dataset.layerType=type; d.dataset.layerName=name; d.style.zIndex=c.z||5; d.style.setProperty('--op-start',c.opStart ?? 1); d.style.setProperty('--op-end',c.opEnd ?? 1); const src=c.src||svgBand(type); d.innerHTML=`<img src="${esc(src)}" alt="${name}">`; return d}
function svgBand(type){const col=encodeURIComponent(spec.theme?.primary||'#f05a22'); const h=type==='top'?260:140; return `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='${h}' viewBox='0 0 1600 ${h}'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop stop-color='%23fff8f0'/><stop offset='1' stop-color='${col}' stop-opacity='.32'/></linearGradient></defs><rect width='1600' height='${h}' fill='url(%23g)'/><path d='M0 ${h*0.65} C320 ${h*0.25},620 ${h*0.9},960 ${h*0.48} S1320 ${h*0.65},1600 ${h*0.25}' fill='none' stroke='${col}' stroke-opacity='.34' stroke-width='16'/></svg>`}
function component(c){const w=document.createElement('div'); w.className='widget '+(c.type==='image'?'image-widget ':'')+(c.className||''); w.dataset.layerName=c.name||c.type||'组件'; w.dataset.componentType=c.type||'text'; Object.assign(w.style,{left:(c.x||0)+'px',top:(c.y||0)+'px',width:(c.w||200)+'px',height:(c.h||100)+'px',zIndex:c.z||30,opacity:c.opacity??1}); if(c.type==='image'){w.innerHTML=`<div class="image-slot">${c.src?`<img src="${esc(c.src)}" alt="${esc(c.name||'图片')}">`:'<div class="img-hint">双击替换图片</div>'}</div>`}else{w.innerHTML=`<div class="widget-body" contenteditable="true">${c.html||'<p>直接编辑文字</p>'}</div>`} return w}
function px(v){return parseFloat(String(v||'0').replace('px',''))||0} function currentPage(){return selected?.closest?.('.page')||$('.page')} function selectable(){return $$('.layer-bg,.layer-top,.layer-footer,.widget')} function zNum(el){return parseInt(el.style.zIndex||getComputedStyle(el).zIndex)||0}
function setEdit(v){edit=v;document.body.classList.toggle('edit-mode',v);$('#editToggle').textContent=v?'关闭编辑':'开启编辑';if(!v)deselect()} function deselect(){selectable().forEach(x=>x.classList.remove('selected'));selected=null;$('#propPanel').classList.remove('active','for-image','for-bg')} function select(el){if(!edit||!el)return;selectable().forEach(x=>x.classList.remove('selected'));selected=el;el.classList.add('selected');syncPanel(el)}
function syncPanel(el){const p=$('#propPanel');p.classList.add('active');const isImg=el.classList.contains('layer-top')||el.classList.contains('layer-footer')||el.classList.contains('image-widget');p.classList.toggle('for-image',isImg);p.classList.toggle('for-bg',el.classList.contains('layer-bg'));$('#propTitle').textContent=el.dataset.layerName||'属性';$('#layerOpacity').value=Math.round((parseFloat(el.style.opacity||1))*100);$('#imgTopOpacity').value=Math.round(parseFloat(el.style.getPropertyValue('--op-start')||1)*100);$('#imgBottomOpacity').value=Math.round(parseFloat(el.style.getPropertyValue('--op-end')||1)*100)}
function chooseImage(cb){const picker=$('#imagePicker');picker.onchange=()=>{const f=picker.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f);picker.value=''};picker.click()} function replaceImageLayer(layer){if(!layer)return;chooseImage(src=>{let img=layer.querySelector('img');if(!img){img=document.createElement('img');layer.appendChild(img)}img.src=src;select(layer)})} function selectedOrPageLayer(type){if(selected?.dataset?.layerType===type)return selected;return currentPage().querySelector(type==='top'?'.layer-top':'.layer-footer')} function setBg(){const bg=currentPage().querySelector('.layer-bg');chooseImage(src=>{bg.style.backgroundImage=`url(${src})`;bg.style.backgroundSize='cover';select(bg)})}
function initSelectableLayer(el){el.addEventListener('mousedown',e=>{if(!edit)return;if(el.classList.contains('widget'))return;e.stopPropagation();select(el)}); if(el.classList.contains('layer-top')||el.classList.contains('layer-footer')) el.addEventListener('dblclick',e=>{if(edit){e.stopPropagation();replaceImageLayer(el)}})}
function initWidget(w){if(w.dataset.ready)return;w.dataset.ready='1';w.addEventListener('mousedown',e=>{if(edit){e.stopPropagation();select(w)}});w.addEventListener('dblclick',e=>{if(edit&&w.classList.contains('image-widget')){e.stopPropagation();replaceWidgetImage(w)}});const c=document.createElement('div');c.className='widget-control';c.innerHTML='<div class="drag-handle">拖动</div><button class="delete-btn">×</button>'+['nw','n','ne','e','se','s','sw','w'].map(d=>`<i class="resize-handle ${d}" data-dir="${d}"></i>`).join('');w.appendChild(c);c.querySelector('.drag-handle').onmousedown=e=>startDrag(e,w);c.querySelector('.delete-btn').onclick=e=>{e.stopPropagation();w.remove();deselect()};c.querySelectorAll('.resize-handle').forEach(h=>h.onmousedown=e=>startResize(e,w,h.dataset.dir))}
function replaceWidgetImage(w){chooseImage(src=>{let slot=w.querySelector('.image-slot')||w.querySelector('.widget-body');slot.innerHTML=`<img src="${src}" style="width:100%;height:100%;object-fit:cover" alt="插图">`})}
function startDrag(e,w){e.preventDefault();e.stopPropagation();select(w);drag={w,startX:e.clientX,startY:e.clientY,l:px(w.style.left),t:px(w.style.top),wi:px(w.style.width),he:px(w.style.height)};document.addEventListener('mousemove',onDrag);document.addEventListener('mouseup',endDrag)} function onDrag(e){if(!drag)return;let l=drag.l+e.clientX-drag.startX,t=drag.t+e.clientY-drag.startY;l=Math.max(0,Math.min(size.w-drag.wi,l));t=Math.max(0,Math.min(size.h-drag.he,t));drag.w.style.left=l+'px';drag.w.style.top=t+'px'} function endDrag(){drag=null;document.removeEventListener('mousemove',onDrag);document.removeEventListener('mouseup',endDrag)}
function startResize(e,w,dir){e.preventDefault();e.stopPropagation();select(w);resize={w,dir,startX:e.clientX,startY:e.clientY,l:px(w.style.left),t:px(w.style.top),wi:px(w.style.width),he:px(w.style.height)};document.addEventListener('mousemove',onResize);document.addEventListener('mouseup',endResize)} function onResize(e){if(!resize)return;let dx=e.clientX-resize.startX,dy=e.clientY-resize.startY,l=resize.l,t=resize.t,w=resize.wi,h=resize.he;if(resize.dir.includes('e'))w=resize.wi+dx;if(resize.dir.includes('s'))h=resize.he+dy;if(resize.dir.includes('w')){w=resize.wi-dx;l=resize.l+dx}if(resize.dir.includes('n')){h=resize.he-dy;t=resize.t+dy}w=Math.max(60,w);h=Math.max(36,h);l=Math.max(0,Math.min(size.w-w,l));t=Math.max(0,Math.min(size.h-h,t));Object.assign(resize.w.style,{left:l+'px',top:t+'px',width:w+'px',height:h+'px'})} function endResize(){resize=null;document.removeEventListener('mousemove',onResize);document.removeEventListener('mouseup',endResize)}
function applyStyle(style){if(!edit)return;let sel=window.getSelection();if(savedRange){sel.removeAllRanges();sel.addRange(savedRange)} if(sel&&sel.rangeCount&&!sel.isCollapsed&&document.body.contains(sel.anchorNode)){const r=sel.getRangeAt(0);const span=document.createElement('span');Object.assign(span.style,style);try{r.surroundContents(span)}catch(err){const frag=r.extractContents();span.appendChild(frag);r.insertNode(span)}savedRange=null}else if(selected){const target=selected.classList.contains('widget')?selected.querySelector('.widget-body'):selected;Object.assign(target.style,style)}} function saveSelection(){if(!edit)return;const sel=window.getSelection();if(sel&&sel.rangeCount&&!sel.isCollapsed&&document.body.contains(sel.anchorNode)){savedRange=sel.getRangeAt(0).cloneRange()}}
function insertText(){const p=currentPage();const div=component({type:'text',name:'新增文字',x:80,y:160,w:280,h:100,z:60,html:'<p>直接编辑文字</p>'});p.appendChild(div);initWidget(div);select(div)} function insertImage(){const p=currentPage();const div=component({type:'image',name:'新增图片',x:Math.floor(size.w*.55),y:160,w:Math.floor(size.w*.25),h:140,z:60});p.appendChild(div);initWidget(div);select(div)} function moveZ(mode){if(!selected)return;let z=zNum(selected);if(mode==='up')z+=1;if(mode==='down')z-=1;if(mode==='top')z=100;if(mode==='bottom')z=1;selected.style.zIndex=z;syncPanel(selected)} function saveHtml(){deselect();const clone=document.documentElement.cloneNode(true);clone.querySelectorAll('.selected').forEach(el=>el.classList.remove('selected'));const html='<!doctype html>\n'+clone.outerHTML;const blob=new Blob([html],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=document.title+'.html';a.click();URL.revokeObjectURL(a.href)}
function initAll(){selectable().forEach(initSelectableLayer);$$('.widget').forEach(initWidget)}

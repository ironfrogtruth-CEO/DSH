# DSH 容器清单 — 本文件描述容器内容与依赖,由 scripts/doctor 校验
container:
  name: dsh-container
  version: 1.0.0
  created: 2026-08-15

runtime:
  dsh: 0.1.1-rc.2
  install: ~/.dsh/install            # 固定安装(版本锁死,不依赖 npx 缓存)
  node: /usr/local/bin/node          # brew node 25.5.0
  entry: bin/dsh                     # 统一入口(等价 npx @deepseek-ai/dsh)

profile:
  id: web
  bundles:
    - "@deepseek-ai/dsh-base"
    - "@deepseek-ai/dsh-web-app"
  web: http://127.0.0.1:3080

agent:
  presets:
    - reliable-development          # CyberMarcus; 自有副本在 ~/.dsh/.agent-presets/reliable-development
    - avengers                     # 直接委派模式；父子默认沿用当前会话选中的模型与推理强度
  default: reliable-development
  model:
    provider: deepseek-official
    model: deepseek-v4-pro
    reasoningEffort: high
  permission: danger-full-access
  # CyberMarcus does not mount low-level live Cordis inspect/mount providers;
  # those are Host singletons. Configuration uses bash/fs plus doctor/profile/
  # architecture checks, with execute_flash for bounded specialist work.

capabilities:
  skills:                            # ~/.dsh/skills (runtime-discovered inventory; registry is authoritative)
    - copywriting-craft-writer
    - enterprise-health-business-analysis
    - enterprise-health-data-analysis
    - enterprise-health-data-quality
    - enterprise-health-evidence-validation
    - enterprise-health-orchestrator
    - enterprise-health-page-plan
    - enterprise-health-pdf-export
    - enterprise-health-report
    - enterprise-health-storyline
    - enterprise-health-visual-design
    - enterprise-health-xlsx-ingestion
    - figma
    - figma-implement-design
    - frontend-slides
    - gh-address-comments
    - gh-fix-ci
    - goal-first-control
    - three-provinces-six-ministries
    - html-report-editor
    - jianshibao
    - jupyter-notebook
    - magazine-editor
    - native-chinese-expression
    - notion-meeting-intelligence
    - notion-research-documentation
    - notion-spec-to-implementation
    - pdf
    - pingan-asset-curator
    - pingan-html-materials
    - pingan-kb-router
    - pingan-ppt-materials
    - pingan-qikang-kb-curator
    - pingan-qikang-visual-component-library
    - screenshot
    - sop-export
    - sop-generate
    - sop-orchestrator
    - sop-parse
    - sop-review
    - sop-route
    - sop-structure
    - sop-validate
    - ux-visual-designer
    - wechat-converter
  launchers:                         # ~/.dsh/launchers
    - ashare-launch.command
    - cybermarcus-launch.command
    - dasha-start.command
    - shrimptank-launch.command
  local:
    - bin/dsh-local-ai               # 本地 AI 工具
    - apps/大神.app                  # 原生桌面应用(双击启动,WKWebView 壳)
    - scripts/ensure-web            # 服务保活脚本(不开浏览器)
    - scripts/host-watchdog         # LaunchAgent 探活/幂等拉起(唯一 3080)
    - scripts/install-host-watchdog # 安装/移除当前用户 LaunchAgent

dependencies:                        # 容器依赖的外部资源(不打包)
  ollama:
    note: 本地后台模型（不进入对话模型选择器）
    models:
      # 后台静默模型：由生图、检索适配器按能力调用，不进入对话模型 picker。
      - x/flux2-klein:4b
      - embeddinggemma:latest
  workspaces:
    - ~/Desktop/平安企康              # 平安企康工作区
    - ~/Desktop/虾缸
    - ~/Desktop/大A

data:                                # 不纳入版本管理、导出默认排除
  sessions: ~/.dsh/sessions
  storages: ~/.dsh/storages
  goal-first-state: ~/.dsh/goal-first-state
  backups: ~/.dsh/backups
  dingtalk-state: ~/.dsh-dingtalk         # 官方 Stream 运行态/绑定摘要，0600
  imessage-bridge-legacy: ~/.dsh/private/imessage-bridge  # 迁移保留数据，不再加载，0600
  host-lifecycle: ~/.dsh/private/service-disabled + background-launch # 生命周期哨兵，0600

extensions:                          # 扩展注册点
  presets: ~/.dsh/.agent-presets/    # 自有 agent preset(每目录一个)
  skills: ~/.dsh/skills/             # 技能(每目录一个 SKILL.md)
  plugins: ~/.dsh/extensions/        # 沉淀的插件源码(动态插件永久副本)
  patches: ~/.dsh/profiles/web/cordis.patch.yml
  bundles:
    - "@local/dsh-dsbalance"    # 余额卡片固化 bundle(自动加载)
    - "@local/dsh-knowledge-manager" # 虾缸知识库管理入口(只读模型工具 + UI CRUD)
    - "@dingtalk-real-ai/dsh-dingtalk" # 官方钉钉 Stream 连接器(凭据缺失时 fail-soft)
    - "@local/dsh-dingtalk-status" # 钉钉脱敏状态与侧栏入口(只读)
    - "@local/dsh-shrimp-run-status" # 会话顶部虾/heartbeat真实运行节点状态(只读桥 + UI)
    - "@local/dsh-stenographer" # 免费本地速记：双轨录音、Whisper、ERes2NetV2、块编辑与会话交接

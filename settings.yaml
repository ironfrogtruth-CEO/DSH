ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  # 对话默认走云端 GLM；本地 Ollama 只承载后台媒体/检索模型，不进入对话选择器。
  provider: zhipu-glm
  model: deepseek-flash
  reasoningEffort: high
agent-presets:
  default: reliable-development
permission:
  defaultPreset: danger-full-access
ui-conversation:
  busyEnter: steer
llm-deepseek:
  reasoningEffort: high
  # 当前会话的 Flash/Pro 仍是文本主模型；这里声明 image 仅用于通过 Host
  # durable 附件准入，随后由 shrimp-shell 固定视觉桥接管原图。桥内顺序：
  # V4 Flash Vision → 智谱免费视觉；云端均不可用时明确阻断。
  models:
    - id: deepseek-flash
      name: DeepSeek-V4.1-Flash（正式版）
      inputModalities:
        - text
        - image
    - id: deepseek-v4-pro
      name: DeepSeek-V4-Pro
      inputModalities:
        - text
        - image
    - id: deepseek-v4-flash-vision-exp
      name: DeepSeek-V4-Flash-Vision-Exp
      inputModalities:
        - text
        - image
llm-pi-ai:
  providers:
    zhipu-glm:
      displayName: 智谱 GLM
      api: openai-completions
      baseURL: https://open.bigmodel.cn/api/paas/v4
      apiKeyEnv: ZHIPU_API_KEY
      # glm-5.3-flash 始终思考,"默认"档若落到无 effort 会被 pi-ai zai 格式
      # 写成 thinking:disabled,智谱直接 400 code 1210。这里强制兜底为 high。
      reasoning: high
      models:
        - id: glm-5.3
          name: GLM-5.3
        - id: glm-5.3-flash
          name: GLM-5.3-Flash
          contextWindow: 1048576
          maxTokens: 131072
          input:
            - text
            - image
          reasoningEfforts:
            "off": null
            low: high
            medium: high
            high: high
            max: max
          compat:
            supportsReasoningEffort: true
            thinkingFormat: zai
ui-theme:
  preference: system
locale:
  preference: zh
